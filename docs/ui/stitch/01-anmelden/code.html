<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

text-body-md antialiased"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back or close" class="w-11 h-11 -ml-space-xs rounded-lg flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button><div class="flex items-center gap-space-sm"><img alt="nomorepaper Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrC4xntEo1hrLfeRkdaJ19UzqT6lmK1yDUVTneOANqw9g4kgJyIRrQtX88-4othY0bEbDQVzaBu8_A1JNAZ1YCwRkuAacMuh9qbo5vP7JX-IOqf4js5JDHuCNcxXL-hrT7PFRtX63YN-N6RA51a8itnKXNGCHOgorr9_UDhPmGKomIwlKXgw727BVu5BYmA-9C4i73PbhrCCR-hYUB_0IzsSLvGCJK83mAnqw3-mUu6l"/><span class="font-headline-sm text-headline-sm text-primary tracking-tight font-medium">nomorepaper</span></div></div><div class="flex items-center gap-space-sm"><span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider hidden sm:inline">Login</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full bg-surface pt-16 pb-14"><div class="flex flex-col w-full px-margin max-w-md mx-auto py-space-sm">
<!-- Minimal Brand Header / Welcome -->
<div class="flex flex-col items-center text-center mt-space-xs mb-space-lg">
<div class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center mb-space-md shadow-sm">
<img alt="nomorepaper Icon" class="w-7 h-7 object-contain opacity-95" src="https://lh3.googleusercontent.com/aida/ALJJyrC4xntEo1hrLfeRkdaJ19UzqT6lmK1yDUVTneOANqw9g4kgJyIRrQtX88-4othY0bEbDQVzaBu8_A1JNAZ1YCwRkuAacMuh9qbo5vP7JX-IOqf4js5JDHuCNcxXL-hrT7PFRtX63YN-N6RA51a8itnKXNGCHOgorr9_UDhPmGKomIwlKXgw727BVu5BYmA-9C4i73PbhrCCR-hYUB_0IzsSLvGCJK83mAnqw3-mUu6l"/>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.2em] mb-1">nomorepaper workspace</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight font-semibold">Willkommen zurück</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Melde dich an, um papierlos zu arbeiten.</p>
</div>
<!-- Main MudPaper Container -->
<div class="bg-surface-container-low rounded-xl p-space-md shadow-md flex flex-col gap-space-md">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Email Field (MudTextField Outlined style) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface tracking-wide" for="emailInput">E-Mail-Adresse</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none transition-colors duration-150" id="mailIcon">mail</span>
<input class="w-full h-11 bg-surface-container-lowest text-primary placeholder-outline font-body-md text-body-md pl-10 pr-3 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container focus:text-primary" id="emailInput" onblur="document.getElementById('mailIcon').classList.remove('text-primary')" onfocus="document.getElementById('mailIcon').classList.add('text-primary')" placeholder="name@unternehmen.de" required="" type="email"/>
</div>
</div>
<!-- Password Field (MudTextField Outlined style) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface tracking-wide" for="passwordInput">Passwort</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none transition-colors duration-150" id="lockIcon">lock</span>
<input class="w-full h-11 bg-surface-container-lowest text-primary placeholder-outline font-body-md text-body-md pl-10 pr-11 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container focus:text-primary" id="passwordInput" onblur="document.getElementById('lockIcon').classList.remove('text-primary')" onfocus="document.getElementById('lockIcon').classList.add('text-primary')" placeholder="••••••••" required="" type="password"/>
<button aria-label="Passwort anzeigen oder verbergen" class="absolute right-2 w-8 h-8 rounded flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[19px]" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Actions Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-[18px] h-[18px] rounded bg-surface-container-lowest peer-checked:bg-primary flex items-center justify-center transition-all duration-150">
<span class="material-symbols-outlined text-[15px] text-surface-container-lowest font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Angemeldet bleiben</span>
</label>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary underline-offset-4 hover:underline transition-colors" href="#">
          Passwort vergessen?
        </a>
</div>
<!-- Primary Login Button (MudButton Filled) -->
<button class="w-full h-11 bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-[0.99] hover:bg-surface-bright shadow-sm mt-1" id="submitBtn" type="submit">
<span>Anmelden</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Biometric / Passkey Login Button (MudButton Outlined) -->
<button class="w-full h-11 bg-surface-container hover:bg-surface-container-high text-primary font-body-md text-body-md rounded-lg flex items-center justify-center gap-2.5 transition-colors" onclick="triggerBiometricPrompt()" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">fingerprint</span>
<span>Mit Passkey / Biometrie anmelden</span>
</button>
</form>
<!-- MudDivider with Text -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-[1px] bg-surface-variant"></div>
<span class="absolute bg-surface-container-low px-3 font-label-sm text-label-sm text-outline tracking-widest uppercase">
        Oder weiter mit
      </span>
</div>
<!-- SSO Buttons (Pure Monochrome) -->
<div class="flex flex-col gap-2">
<!-- Microsoft Azure AD SSO -->
<button class="w-full h-11 bg-surface-container hover:bg-surface-container-high text-on-surface font-body-md text-body-md rounded-lg flex items-center justify-center gap-3 px-3 transition-colors group" type="button">
<!-- Monochrome 4-quadrant Microsoft symbol -->
<svg class="w-4 h-4 fill-on-surface-variant group-hover:fill-primary transition-colors flex-shrink-0" viewbox="0 0 21 21">
<rect height="9" width="9" x="1" y="1"></rect>
<rect height="9" width="9" x="11" y="1"></rect>
<rect height="9" width="9" x="1" y="11"></rect>
<rect height="9" width="9" x="11" y="11"></rect>
</svg>
<span class="font-medium text-primary">Microsoft / Azure AD</span>
</button>
<!-- Google Workspace SSO -->
<button class="w-full h-11 bg-surface-container hover:bg-surface-container-high text-on-surface font-body-md text-body-md rounded-lg flex items-center justify-center gap-3 px-3 transition-colors group" type="button">
<!-- Monochrome Google 'G' Symbol -->
<svg class="w-4 h-4 fill-on-surface-variant group-hover:fill-primary transition-colors flex-shrink-0" viewbox="0 0 24 24">
<path d="M21.35 11.1H12v2.98h5.37c-.23 1.25-.94 2.31-2 3.02v2.51h3.24c1.9-1.75 2.74-4.33 2.74-7.41 0-.37-.03-.7-.1-1.1z"></path>
<path d="M12 21c2.7 0 4.96-.9 6.61-2.43l-3.24-2.51c-.9.6-2.05.95-3.37.95-2.6 0-4.8-1.76-5.59-4.12H3.06v2.58C4.71 18.73 8.08 21 12 21z"></path>
<path d="M6.41 12.89c-.2-.6-.31-1.24-.31-1.89s.11-1.29.31-1.89V6.53H3.06C2.38 7.89 2 9.4 2 11s.38 3.11 1.06 4.47l3.35-2.58z"></path>
<path d="M12 5.38c1.47 0 2.79.51 3.83 1.5l2.87-2.87C17 2.21 14.7 1.2 12 1.2 8.08 1.2 4.71 3.47 3.06 6.73l3.35 2.58c.79-2.36 2.99-4.12 5.59-4.12z"></path>
</svg>
<span class="font-medium text-primary">Google Workspace</span>
</button>
</div>
</div>
<!-- Registration & Security Footer Area -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-sm gap-space-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      Noch kein nomorepaper-Konto?
      <a class="text-primary font-medium underline underline-offset-4 hover:text-outline-variant transition-colors ml-1" href="#">
        Jetzt registrieren
      </a>
</p>
<!-- Subtle Trust / Paperless Status Pip -->
<div class="flex items-center gap-2 py-1 px-3 rounded-full bg-surface-container-low">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Ende-zu-Ende verschlüsselt nach DSGVO & GoBD</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwd = document.getElementById('passwordInput');
    const eye = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      eye.textContent = 'visibility';
    } else {
      pwd.type = 'password';
      eye.textContent = 'visibility_off';
    }
  }

  function triggerBiometricPrompt() {
    const feedbackText = 'Biometrischer Sensor aktiviert. Bitte Fingerabdruck oder FaceID bestätigen...';
    if (window.navigator.vibrate) {
      window.navigator.vibrate(35);
    }
    const btn = event.currentTarget;
    const originalContent = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-primary animate-spin">progress_activity</span><span>Authentifizierung...</span>`;
    setTimeout(() => {
      btn.innerHTML = originalContent;
    }, 1200);
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Wird angemeldet...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span>Erfolgreich</span><span class="material-symbols-outlined text-[18px]">check</span>`;
      setTimeout(() => {
        btn.innerHTML = `<span>Anmelden</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
      }, 1500);
    }, 900);
  }
</script></main><footer class="w-full py-space-sm px-margin flex items-center justify-center gap-space-md text-center bg-surface/90 pb-safe"><a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors py-space-xs" data-path="datenschutz" href="#">Datenschutz</a><span class="text-outline text-[10px] select-none">•</span><a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors py-space-xs" data-path="impressum" href="#">Impressum</a><span class="text-outline text-[10px] select-none">•</span><a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors py-space-xs" data-path="hilfe" href="#">Hilfe</a></footer></body></html>
