<script>
  const lines = [
    { text: 'Gutachten zum Grundstück Musterweg 7', size: 31, bold: true },
    { text: 'Sachverständigenbüro Beispiel · Testdokument' },
    { text: '' },
    { text: 'Das folgende Foto ist Teil des gescannten Blattes.' },
    { text: 'Es soll in Originalfarben bleiben, der Text nicht.' },
    { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' },
    { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' },

    { text: '' },
    { text: 'Das Grundstück liegt am Ortsrand. Die Zufahrt erfolgt' },
    { text: 'über einen befestigten Weg. Der Zustand ist gepflegt.' },
    { text: 'Größe ................................... 812 m²' },
    { text: 'Bodenrichtwert ...................... 145,00 EUR/m²' },
    { text: 'Verkehrswert ....................... 117.740,00 EUR', bold: true },
  ];
  const photo = { canvas: makePhoto(900, 540, 7), x: 170, y: 425, width: 900, height: 540 };
