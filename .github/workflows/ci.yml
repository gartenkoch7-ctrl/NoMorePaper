name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    # Pinned: Playwright's --with-deps knows only the Ubuntu releases of its version; a moving
    # ubuntu-latest broke the browser install (M4, run 28/29).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Cheap check first, so a too-long file is reported even when tests fail.
      - name: Check file length (max 300 lines)
        shell: pwsh
        run: ./scripts/check-file-length.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NoMorePaper.slnx

      - name: Build
        run: dotnet build NoMorePaper.slnx -c Release --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $script = Get-ChildItem tests/NoMorePaper.UI.Tests/bin/Release -Recurse -Filter playwright.ps1 | Select-Object -First 1
          if (-not $script) { throw 'playwright.ps1 not found in UI test build output' }
          # apt mirrors and the browser CDN fail now and then; three tries before the run is red.
          foreach ($try in 1..3) {
            & $script.FullName install --with-deps chromium
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Playwright install failed (try $try of 3)"
            Start-Sleep -Seconds 20
          }
          exit 1

      # The OCR tests skip themselves without these tools; here they run with the Worker image's packages.
      # libheif-plugin-libde265 decodes HEIC like the Worker; libheif-plugin-x265 only lets the tests encode a HEIC sample.
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr-deu tesseract-ocr-eng img2pdf libheif-examples libheif-plugin-libde265 libheif-plugin-x265 poppler-utils qpdf

      - name: Test
        # One test project at a time: the real OCR tests (only here, not on Windows) keep the
        # 2-core runner busy, and a UI test booting the WASM app in parallel missed its 60 s timeout.
        run: dotnet test --solution NoMorePaper.slnx -c Release --no-build --report-xunit-trx --max-parallel-test-modules 1

      # Annotations are readable without signing in, unlike job logs and artifacts.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $message = "$($_.Output.ErrorInfo.Message)" -replace '\r?\n', ' '
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Output "::error title=$($_.testName)::$message"
            }
          }

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
